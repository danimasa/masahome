services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - ${DATA_PATH}/hermes:/opt/data
      - ${HOME}/OneDrive:/onedrive
    networks:
      - finance_finance
    environment:
      - HERMES_DASHBOARD=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH}
      - HONCHO_API_KEY=${HONCHO_API_KEY}
      - WIKI_PATH=${WIKI_PATH}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - METABASE_API_KEY=${METABASE_API_KEY}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

networks:
  finance_finance:
    external: true
