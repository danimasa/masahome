services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ${DATA_PATH}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    extra_hosts:
      - "201.16.128.30:201.16.128.30"
    ports:
      - 21063:21063
      - 21064:21064
    networks:
      - proxy
      - hass
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hass.rule=Host(`hass.masahome.online`)"
      - "traefik.http.routers.hass.entrypoints=web"
      - "traefik.http.services.hass.loadbalancer.server.port=8123"

  mdns-reflector:
    image: flungo/avahi:latest
    restart: unless-stopped
    networks:
      - physical
      - hass
    environment:
      - "REFLECTOR_ENABLE_REFLECTOR=yes"

networks:
  proxy:
    external: true
  physical:
    external: true
  hass:
